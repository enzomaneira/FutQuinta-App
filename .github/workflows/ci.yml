# Roda os testes a cada push e pull request na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: futquinta
          POSTGRES_PASSWORD: futquinta
          POSTGRES_DB: futquinta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U futquinta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://futquinta:futquinta@localhost:5432/futquinta_test
      JWT_SECRET: segredo-so-para-o-ci-com-tamanho-suficiente
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Modelos e migrations batem
        env:
          DATABASE_URL: postgresql+psycopg://futquinta:futquinta@localhost:5432/futquinta_test
        run: alembic check

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
